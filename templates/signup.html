{% extends "base.html" %}

{% block title %}Sign Up | SkillMatch{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <span class="eyebrow">Create Account</span>
                <h1 class="display-6 fw-bold mt-3 mb-3">Join SkillMatch</h1>
                <p class="text-secondary mb-4">
                    Create an account as a regular user or project owner and start using the platform.
                </p>

                <form action="{{ url_for('signup') }}" method="post" class="row g-3">
                    <div class="col-12">
                        <label for="name" class="form-label">Name</label>
                        <input
                            type="text"
                            class="form-control"
                            id="name"
                            name="name"
                            value="{{ form_data.get('name', '') }}"
                            required
                        >
                    </div>

                    <div class="col-12">
                        <label for="email" class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            value="{{ form_data.get('email', '') }}"
                            required
                        >
                    </div>

                    <div class="col-md-6">
                        <label for="location" class="form-label">Location</label>
                        <input
                            type="text"
                            class="form-control"
                            id="location"
                            name="location"
                            value="{{ form_data.get('location', '') }}"
                        >
                    </div>

                    <div class="col-md-6">
                        <label for="experience_level" class="form-label">Experience Level</label>
                        <select class="form-select" id="experience_level" name="experience_level" required>
                            <option value="">Select experience level</option>
                            {% for level in ["Beginner", "Junior", "Intermediate", "Senior", "Graduate"] %}
                                <option
                                    value="{{ level }}"
                                    {% if form_data.get('experience_level') == level %}selected{% endif %}
                                >
                                    {{ level }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12">
                        <label for="role" class="form-label">Account Type</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="">Select account type</option>
                            <option value="user" {% if form_data.get('role') == 'user' %}selected{% endif %}>Regular User</option>
                            <option value="owner" {% if form_data.get('role') == 'owner' %}selected{% endif %}>Project Owner</option>
                        </select>
                    </div>

                    <div class="col-12 d-flex gap-2 pt-2">
                        <button type="submit" class="btn btn-primary">Create Account</button>
                        <a href="{{ url_for('login') }}" class="btn btn-outline-secondary">Already have an account?</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
